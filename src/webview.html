<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!--
		CSP is injected by extension.js immediately after the charset meta tag.
		No template tokens are used for CSP — extension.js inserts the full
		<meta http-equiv="Content-Security-Policy" ...> element at runtime.
	-->
	<title>PDF Viewer</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: var(--vscode-editor-background);
			color: var(--vscode-editor-foreground);
			height: 100vh;
			overflow: hidden;
			display: flex;
			flex-direction: column;
		}

		/* ── Toolbar ─────────────────────────────────────────── */

		.toolbar {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 6px 12px;
			background: var(--vscode-editorWidget-background);
			border-bottom: 1px solid var(--vscode-widget-border, rgba(128, 128, 128, 0.2));
			flex-shrink: 0;
			user-select: none;
		}

		.toolbar button {
			background: transparent;
			border: 1px solid var(--vscode-widget-border, rgba(128, 128, 128, 0.2));
			color: var(--vscode-editor-foreground);
			border-radius: 4px;
			padding: 3px 8px;
			font-size: 0.85em;
			cursor: pointer;
			line-height: 1.4;
			transition: background 0.12s ease, border-color 0.12s ease;
		}

		.toolbar button:hover {
			background: var(--vscode-list-hoverBackground);
			border-color: var(--vscode-focusBorder);
		}

		.toolbar button:disabled {
			opacity: 0.35;
			cursor: default;
		}

		.toolbar button:disabled:hover {
			background: transparent;
			border-color: var(--vscode-widget-border, rgba(128, 128, 128, 0.2));
		}

		.page-input {
			width: 44px;
			text-align: center;
			background: var(--vscode-input-background);
			color: var(--vscode-input-foreground);
			border: 1px solid var(--vscode-input-border, rgba(128, 128, 128, 0.3));
			border-radius: 4px;
			padding: 2px 4px;
			font-size: 0.85em;
		}

		.page-label {
			font-size: 0.85em;
			color: var(--vscode-descriptionForeground);
			white-space: nowrap;
		}

		.toolbar-sep {
			width: 1px;
			height: 16px;
			background: var(--vscode-widget-border, rgba(128, 128, 128, 0.2));
			margin: 0 2px;
		}

		/* ── Canvas viewport ──────────────────────────────────── */

		.viewport {
			flex: 1;
			overflow: auto;
			padding: 16px;
			background: var(--vscode-editor-background);
			display: flex;
			flex-direction: column;
		}

		.page-container {
			position: relative;
			display: block;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
			background: #fff;
			/* PDF page background is always white */
			margin: auto;
			flex-shrink: 0;
		}

		#pdf-canvas {
			display: block;
			user-select: none;
			-webkit-user-select: none;
		}

		/* ── Text Layer ───────────────────────────────────────── */

		.textLayer {
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			overflow: hidden;
			line-height: 1;
			text-size-adjust: none;
			forced-color-adjust: none;
			transform-origin: 0 0;
			z-index: 2;
			user-select: text;
			-webkit-user-select: text;
		}

		.textLayer span,
		.textLayer br {
			color: transparent;
			position: absolute;
			white-space: pre;
			cursor: text;
			transform-origin: 0% 0%;
		}

		/* Required for some dynamic CSS calc() in PDF.js TextLayer */
		.textLayer {
			--scale-factor: 1;
			--total-scale-factor: var(--scale-factor);
			--scale-round-x: 1px;
			--scale-round-y: 1px;
		}

		.textLayer ::selection {
			background: rgba(0, 0, 255, 0.25);
			color: transparent;
		}

		/* ── Empty / error state ──────────────────────────────── */

		.status-message {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100%;
			font-size: 1em;
			color: var(--vscode-descriptionForeground);
			text-align: center;
			padding: 32px;
		}

		/* ── Search (inline in toolbar) ──────────────────────── */

		.search-input {
			width: 180px;
			background: var(--vscode-input-background);
			color: var(--vscode-input-foreground);
			border: 1px solid var(--vscode-input-border, rgba(128, 128, 128, 0.3));
			border-radius: 4px;
			padding: 2px 6px;
			font-size: 0.85em;
		}

		.search-count {
			font-size: 0.8em;
			color: var(--vscode-descriptionForeground);
			min-width: 56px;
			white-space: nowrap;
		}

		/* ── Search highlights (injected <mark> elements) ─────── */

		.textLayer mark.search-mark {
			color: transparent;
			background: rgba(255, 200, 0, 0.45);
			border-radius: 2px;
		}

		.textLayer mark.search-mark.search-highlight-current {
			background: rgba(255, 120, 0, 0.55);
			outline: 1px solid rgba(255, 120, 0, 0.85);
		}
	</style>
</head>

<body>

	<!-- Toolbar -->
	<div class="toolbar">
		<button id="btn-prev" aria-label="Previous page" title="Previous page (←)">&#8249;</button>
		<input id="page-input" class="page-input" type="number" min="1" aria-label="Current page" />
		<span id="page-total" class="page-label">/ —</span>
		<button id="btn-next" aria-label="Next page" title="Next page (→)">&#8250;</button>

		<div class="toolbar-sep"></div>

		<button id="btn-zoom-out" aria-label="Zoom out" title="Zoom out (-)">−</button>
		<button id="btn-zoom-fit" aria-label="Fit Page" title="Fit Page">Fit Page</button>
		<button id="btn-zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>

		<div class="toolbar-sep"></div>

		<input id="search-input" class="search-input" type="text" placeholder="Find…" aria-label="Find in document"
			autocomplete="off" spellcheck="false" />
		<span id="search-count" class="search-count" aria-live="polite"></span>
		<button id="btn-search-prev" aria-label="Previous match" title="Previous match (Shift+Enter)">↑</button>
		<button id="btn-search-next" aria-label="Next match" title="Next match (Enter)">↓</button>
	</div>

	<!-- PDF canvas viewport -->
	<div class="viewport" id="viewport">
		<div class="page-container" id="page-container">
			<canvas id="pdf-canvas"></canvas>
			<div id="text-layer" class="textLayer"></div>
		</div>
	</div>

	<script type="module" nonce="{{NONCE}}">
		// ── PDF.js setup ───────────────────────────────────────────────
		// Loaded from local bundle — no CDN, works fully offline.
		// isEvalSupported: false disables PDF JavaScript execution.
		import * as pdfjsLib from "{{PDFJS_URI}}";

		pdfjsLib.GlobalWorkerOptions.workerSrc = "{{WORKER_URI}}";

		// ── State ──────────────────────────────────────────────────────
		let pdfDoc = null;
		let currentPage = 1;
		let currentZoom = "{{DEFAULT_ZOOM}}";
		let renderTask = null;   // Track in-flight renders to cancel on nav
		let activeTextLayer = null; // Track instances of PDF.js TextLayer

		const canvas = document.getElementById("pdf-canvas");
		const ctx = canvas.getContext("2d");
		const viewport = document.getElementById("viewport");
		const pageContainer = document.getElementById("page-container");
		const textLayerDiv = document.getElementById("text-layer");
		const btnPrev = document.getElementById("btn-prev");
		const btnNext = document.getElementById("btn-next");
		const pageInput = document.getElementById("page-input");
		const pageTotal = document.getElementById("page-total");
		const btnZoomFit = document.getElementById("btn-zoom-fit");

		// ── Search state ───────────────────────────────────────────────
		const searchInput = document.getElementById("search-input");
		const searchCount = document.getElementById("search-count");
		const btnSearchPrev = document.getElementById("btn-search-prev");
		const btnSearchNext = document.getElementById("btn-search-next");

		let searchIndex = [];   // [{page, fullText}] — built after PDF loads
		let searchMatches = []; // [{page, occurrenceOnPage}] — global match list
		let searchMatchIdx = -1; // index into searchMatches

		// ── Zoom helpers ───────────────────────────────────────────────

		async function computeScale(pdfPage) {
			const unscaledVp = pdfPage.getViewport({ scale: 1 });
			let availW = Math.max(1, viewport.clientWidth - 32);  // 16px padding each side
			const availH = Math.max(1, viewport.clientHeight - 32);

			if (currentZoom === "fit-page") {
				return Math.min(availW / unscaledVp.width, availH / unscaledVp.height);
			}
			return parseFloat(currentZoom) / 100;
		}

		// ── Render ─────────────────────────────────────────────────────

		async function renderPage(pageNum) {
			if (!pdfDoc) return;

			// Cancel any in-flight render
			if (renderTask) {
				renderTask.cancel();
				renderTask = null;
			}
			if (activeTextLayer) {
				activeTextLayer.cancel();
				activeTextLayer = null;
			}

			// Clear text layer DOM
			textLayerDiv.innerHTML = "";

			const page = await pdfDoc.getPage(pageNum);
			const scale = await computeScale(page);
			const pv = page.getViewport({ scale });

			// Multiplier for High DPI (Retina) screens
			const outputScale = window.devicePixelRatio || 1;

			canvas.width = Math.floor(pv.width * outputScale);
			canvas.height = Math.floor(pv.height * outputScale);
			canvas.style.width = Math.floor(pv.width) + "px";
			canvas.style.height = Math.floor(pv.height) + "px";

			const transform = outputScale !== 1
				? [outputScale, 0, 0, outputScale, 0, 0]
				: null;

			// Sync text layer boundaries and scale custom properties
			textLayerDiv.style.width = Math.floor(pv.width) + "px";
			textLayerDiv.style.height = Math.floor(pv.height) + "px";
			textLayerDiv.style.setProperty("--scale-factor", scale);

			// We handle box-shadow on the page wrapper
			pageContainer.style.width = Math.floor(pv.width) + "px";
			pageContainer.style.height = Math.floor(pv.height) + "px";

			renderTask = page.render({
				canvasContext: ctx,
				transform: transform,
				viewport: pv
			});
			try {
				await renderTask.promise;

				// Render Text Layer
				if (page.streamTextContent) {
					activeTextLayer = new pdfjsLib.TextLayer({
						textContentSource: page.streamTextContent(),
						container: textLayerDiv,
						viewport: pv,
					});
					await activeTextLayer.render();
				}

				// Re-apply search highlights after every page render (if a search is active)
				if (searchInput.value.trim()) {
					applySearchHighlights(searchInput.value.trim());
				}
			} catch (err) {
				if (err?.name !== "RenderingCancelledException" && err?.name !== "AbortException") {
					console.error("PDF render error:", err);
					showStatus("Failed to render page " + pageNum);
				}
				return;
			}

			currentPage = pageNum;
			saveState();
			updateToolbar();
		}

		function updateToolbar() {
			if (!pdfDoc) return;
			const total = pdfDoc.numPages;
			pageInput.value = currentPage;
			pageTotal.textContent = "/ " + total;
			btnPrev.disabled = currentPage <= 1;
			btnNext.disabled = currentPage >= total;
		}

		function showStatus(msg) {
			pageContainer.style.display = "none";
			let s = document.querySelector(".status-message");
			if (!s) {
				s = document.createElement("div");
				s.className = "status-message";
				viewport.appendChild(s);
			}
			s.textContent = msg;
		}

		// ── Navigation ─────────────────────────────────────────────────

		function goTo(n) {
			if (!pdfDoc) return;
			const clamped = Math.max(1, Math.min(pdfDoc.numPages, n));
			if (clamped !== currentPage) renderPage(clamped);
		}

		function goNext() { goTo(currentPage + 1); }
		function goPrev() { goTo(currentPage - 1); }

		btnNext.addEventListener("click", goNext);
		btnPrev.addEventListener("click", goPrev);

		pageInput.addEventListener("change", () => {
			goTo(parseInt(pageInput.value, 10) || currentPage);
		});

		// Keyboard navigation
		document.addEventListener("keydown", (e) => {
			// Focus search bar with Ctrl+F / Cmd+F
			if ((e.ctrlKey || e.metaKey) && e.key === "f") {
				e.preventDefault();
				focusSearch();
				return;
			}
			if (document.activeElement === pageInput) return;
			if (document.activeElement === searchInput) return;
			if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "PageDown") {
				e.preventDefault();
				goNext();
			} else if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "PageUp") {
				e.preventDefault();
				goPrev();
			} else if (e.key === "+" || e.key === "=") {
				adjustZoom(+1);
			} else if (e.key === "-") {
				adjustZoom(-1);
			}
		});

		// Scroll-wheel page navigation (with cooldown to avoid runaway)
		let scrollCooldown = false;
		viewport.addEventListener("wheel", (e) => {
			// Only intercept when at the scroll boundary, to allow normal scrolling
			const atTop = viewport.scrollTop === 0;
			const atBottom = viewport.scrollTop + viewport.clientHeight >= viewport.scrollHeight - 1;
			if (e.deltaY > 0 && atBottom) {
				if (scrollCooldown) return;
				scrollCooldown = true;
				setTimeout(() => { scrollCooldown = false; }, 400);
				goNext();
			} else if (e.deltaY < 0 && atTop) {
				if (scrollCooldown) return;
				scrollCooldown = true;
				setTimeout(() => { scrollCooldown = false; }, 400);
				goPrev();
			}
		});

		// ── Zoom ───────────────────────────────────────────────────────

		const ZOOM_STEPS = ["50", "75", "100", "125", "150", "200"];

		function adjustZoom(direction) {
			let current = currentZoom;
			if (current === "fit-page") {
				current = "100";
			}
			const currentNum = parseFloat(current) || 100;

			let nextV = currentNum;
			if (direction > 0) {
				const nextStep = ZOOM_STEPS.find(s => parseFloat(s) > currentNum);
				nextV = nextStep || ZOOM_STEPS[ZOOM_STEPS.length - 1];
			} else {
				const rev = [...ZOOM_STEPS].reverse();
				const nextStep = rev.find(s => parseFloat(s) < currentNum);
				nextV = nextStep || ZOOM_STEPS[0];
			}
			setZoom(nextV);
		}

		function setZoom(value) {
			currentZoom = value;
			saveState();
			if (pdfDoc) renderPage(currentPage);
		}

		document.getElementById("btn-zoom-in").addEventListener("click", () => adjustZoom(+1));
		document.getElementById("btn-zoom-out").addEventListener("click", () => adjustZoom(-1));
		btnZoomFit.addEventListener("click", () => setZoom("fit-page"));

		// ── Search ─────────────────────────────────────────────────────

		async function buildSearchIndex() {
			searchIndex = [];
			for (let p = 1; p <= pdfDoc.numPages; p++) {
				const page = await pdfDoc.getPage(p);
				const textContent = await page.getTextContent();
				searchIndex.push({
					page: p,
					fullText: textContent.items.map(item => item.str || "").join(""),
				});
			}
		}

		function runSearch(query) {
			searchMatches = [];
			searchMatchIdx = -1;
			if (!query || !searchIndex.length) {
				updateSearchCount();
				applySearchHighlights("");
				return;
			}
			const lq = query.toLowerCase();
			for (const entry of searchIndex) {
				const pageText = entry.fullText.toLowerCase();
				let pos = 0;
				let occ = 0;
				while ((pos = pageText.indexOf(lq, pos)) !== -1) {
					searchMatches.push({ page: entry.page, occurrenceOnPage: occ });
					pos += lq.length;
					occ++;
				}
			}
			if (searchMatches.length > 0) {
				searchMatchIdx = 0;
				navigateToMatch(0);
			} else {
				updateSearchCount();
				applySearchHighlights(query);
			}
		}

		function navigateToMatch(idx) {
			if (!searchMatches.length) return;
			searchMatchIdx = ((idx % searchMatches.length) + searchMatches.length) % searchMatches.length;
			const match = searchMatches[searchMatchIdx];
			updateSearchCount();
			if (match.page !== currentPage) {
				renderPage(match.page);
			} else {
				applySearchHighlights(searchInput.value.trim());
			}
		}

		function applySearchHighlights(query) {
			// Unwrap any previously injected <mark> elements, restoring plain text nodes
			textLayerDiv.querySelectorAll("mark.search-mark").forEach(mark => {
				mark.replaceWith(mark.textContent);
			});
			textLayerDiv.normalize(); // merge adjacent text nodes left by unwrapping
			if (!query) return;
			const lq = query.toLowerCase();
			const currentOcc = (searchMatches[searchMatchIdx] && searchMatches[searchMatchIdx].page === currentPage)
				? searchMatches[searchMatchIdx].occurrenceOnPage
				: -1;
			const spans = textLayerDiv.querySelectorAll("span");
			let occIdx = 0;
			let currentEl = null;
			for (const span of spans) {
				// Skip spans that contain child elements (e.g. nested PDF.js markup)
				if (span.querySelector("*")) continue;
				const text = span.textContent;
				const textLower = text.toLowerCase();
				if (!textLower.includes(lq)) continue;
				// Rebuild span content: plain text nodes interleaved with <mark> wrappers
				const fragment = document.createDocumentFragment();
				let pos = 0;
				let matchStart;
				while ((matchStart = textLower.indexOf(lq, pos)) !== -1) {
					if (matchStart > pos) {
						fragment.appendChild(document.createTextNode(text.slice(pos, matchStart)));
					}
					const mark = document.createElement("mark");
					mark.className = occIdx === currentOcc
						? "search-mark search-highlight-current"
						: "search-mark";
					mark.textContent = text.slice(matchStart, matchStart + lq.length);
					if (occIdx === currentOcc) currentEl = mark;
					fragment.appendChild(mark);
					occIdx++;
					pos = matchStart + lq.length;
				}
				if (pos < text.length) {
					fragment.appendChild(document.createTextNode(text.slice(pos)));
				}
				span.replaceChildren(fragment);
			}
			if (currentEl) {
				currentEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
			} else if (occIdx > 0) {
				const first = textLayerDiv.querySelector(".search-mark");
				if (first) first.scrollIntoView({ block: "nearest", behavior: "smooth" });
			}
		}

		function updateSearchCount() {
			if (!searchInput.value.trim()) {
				searchCount.textContent = "";
				return;
			}
			if (!searchMatches.length) {
				searchCount.textContent = "No results";
				return;
			}
			searchCount.textContent = `${searchMatchIdx + 1} of ${searchMatches.length}`;
		}

		function focusSearch() {
			searchInput.focus();
			searchInput.select();
		}

		function clearSearch() {
			searchInput.value = "";
			searchMatches = [];
			searchMatchIdx = -1;
			searchCount.textContent = "";
			applySearchHighlights("");
		}

		searchInput.addEventListener("input", () => {
			runSearch(searchInput.value.trim());
		});

		searchInput.addEventListener("keydown", (e) => {
			if (e.key === "Enter") {
				e.preventDefault();
				if (e.shiftKey) {
					navigateToMatch(searchMatchIdx - 1);
				} else {
					navigateToMatch(searchMatchIdx + 1);
				}
			} else if (e.key === "Escape") {
				e.preventDefault();
				clearSearch();
				searchInput.blur();
			}
			// Prevent navigation keys from bubbling to the main keydown handler
			e.stopPropagation();
		});

		btnSearchPrev.addEventListener("click", () => navigateToMatch(searchMatchIdx - 1));
		btnSearchNext.addEventListener("click", () => navigateToMatch(searchMatchIdx + 1));

		// ── VS Code message channel ─────────────────────────────────────
		// Mirrors mermaid-slideshow postMessage pattern.

		const vscode = acquireVsCodeApi();

		function saveState() {
			vscode.setState({ page: currentPage, zoom: currentZoom });
		}

		// Resize listener to re-render if fitting to width/page
		let resizeTimeout = null;
		window.addEventListener("resize", () => {
			if (currentZoom === "fit-page") {
				clearTimeout(resizeTimeout);
				resizeTimeout = setTimeout(() => {
					if (pdfDoc) renderPage(currentPage);
				}, 150);
			}
		});

		window.addEventListener("message", async (event) => {
			const message = event.data;
			if (message.type === "init") {
				const loadingTask = pdfjsLib.getDocument({
					url: message.pdfUrl,
					isEvalSupported: false,   // Disable PDF JavaScript
					disableFontFace: false,
				});
				try {
					pdfDoc = await loadingTask.promise;
					pageContainer.style.display = "inline-block";
					pageInput.max = pdfDoc.numPages;
					const saved = vscode.getState();
					if (saved && saved.zoom) {
						currentZoom = saved.zoom;
					}
					const startPage = (saved && saved.page)
						? Math.max(1, Math.min(pdfDoc.numPages, saved.page))
						: 1;
					await renderPage(startPage);
					await buildSearchIndex();
				} catch (err) {
					console.error("PDF load error:", err);
					showStatus("Could not load PDF.");
				}
			}
		});

		// Signal to extension host that webview is ready to receive init
		vscode.postMessage({ type: "ready" });

		// Clean up PDF.js resources when the webview is unloaded
		window.addEventListener("pagehide", () => {
			clearTimeout(resizeTimeout);
			if (renderTask) {
				renderTask.cancel();
			}
			if (activeTextLayer) {
				activeTextLayer.cancel();
			}
			if (pdfDoc) {
				pdfDoc.destroy();
				pdfDoc = null;
			}
		});
	</script>
</body>

</html>
